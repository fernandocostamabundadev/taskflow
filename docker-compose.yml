version: "3.8"
services:
  db:
    image:
    container_name: taskflow-db
    restart: always
    environment:
      - POSTEGRE_USER:taskflow
      - POSTEGRE_PASSWORD:taskflow
      - POSTEGRE_DB :taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - taskflow-network
